[server]
host = "127.0.0.1"
port = 8000
api_key = ""

[debug]
# true 强制有头；false 强制无头；删除此行则由 worker.headless 决定
headed = true
slowmo_ms = 0
trace = false

[worker]
# 仅在 debug.headed 未设置时生效
headless = false
poll_interval_ms = 500
timeout_first_token_s = 120
timeout_completion_s = 600
max_queue_len = 20

[profile]
path = "data/profile"

[providers.deepseek]
enabled = true
profile = "data/profile"

[providers.yuanbao]
enabled = true
profile = "data/profiles/yuanbao"

# 文心（wenxin.baidu.com）：图片生成 / 帮我写作 / PPT生成。
# 首次启用需在有头浏览器里登录一次（freeaiproxy relogin --provider wenxin）。
[providers.wenxin]
enabled = false
profile = "data/profiles/wenxin"

# 智谱清言（chatglm.cn）：GLM-5.3 深度思考 / AI画图（GLM Image，去水印）。
# 需要先在有头浏览器里登录一次，登录态保存在 profile 目录。
[providers.chatglm]
enabled = false
profile = "data/profiles/chatglm"

[attach]
enabled = true
max_size_mb = 20
max_files = 5
download_remote_urls = true
remote_timeout_s = 30

# 豆包（doubao.com/chat/）：对话 / 图像生成（Seedream，比例+风格+模型）/
# 视频生成（Seedance，比例+时长）/ 音乐生成（曲风+情绪+音色+歌词模式）。
# 首次启用需在有头浏览器里登录一次（freeaiproxy relogin --provider doubao）。
[providers.doubao]
enabled = false
profile = "data/profiles/doubao"
