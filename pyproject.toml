[project]
name = "freeaiproxy"
version = "0.2.0"
description = "Web-to-OpenAI-API gateway for DeepSeek and Tencent Yuanbao (Camoufox powered)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "camoufox[geoip]>=0.5.0",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "typer>=0.12",
    "rich>=13.0",
    "psutil>=5.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "openai>=1.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
freeaiproxy = "freeaiproxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freeaiproxy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "poc", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"poc/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src/freeaiproxy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
